<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#cdb8d2" />
    <meta name="color-scheme" content="light" />
    <meta name="description" content="CICT Student Hub: share and rate reviewers, and NFC door attendance for CICT events." />
    <!-- A small inline icon: no extra request, and no failed /favicon.ico lookup -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%235b3e70'/%3E%3Ctext x='16' y='23' font-family='system-ui,sans-serif' font-size='20' font-weight='700' fill='white' text-anchor='middle'%3EC%3C/text%3E%3C/svg%3E" />
    <title>CICT Student Hub</title>
    <!-- Paints the page colour and a small mark straight away, before the stylesheet and scripts arrive, so there is
         no white flash on a slow connection. React replaces everything inside #root once it starts. -->
    <style>
      html, body { margin: 0; background: #cdb8d2; }
      .boot { display: grid; min-height: 100vh; place-items: center; }
      .boot span { display: grid; width: 48px; height: 48px; place-items: center; border-radius: 15px; background: #5b3e70; color: #fff; font: 600 22px system-ui, sans-serif; animation: boot 1.2s ease-in-out infinite; }
      @keyframes boot { 0%, 100% { opacity: 0.55; transform: scale(0.96); } 50% { opacity: 1; transform: scale(1); } }
      @media (prefers-reduced-motion: reduce) { .boot span { animation: none; } }
    </style>
  </head>
  <body>
    <div id="root"><div class="boot" role="status" aria-label="Loading"><span>C</span></div></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
